name: Patch feature UI fixes

on:
  push:
    branches:
      - feature/performance-optimization-v2

permissions:
  contents: write

jobs:
  patch-ui-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/performance-optimization-v2
      - name: Patch app render paths
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'\n    with tab6:\n        # PERF: Lazy load AI Signals - only compute when tab opened\n        if not is_tab_rendered\("ai_signals"\):\n(?:            .*\n)+?            mark_tab_rendered\("ai_signals"\)\n\s*',
              '\n    with tab6:\n',
              text,
              count=1,
          )
          text = re.sub(
              r'\n    with tab7:\n        # PERF: Lazy load Backtest - expensive computation only when tab opened\n        if not is_tab_rendered\("backtest"\):\n(?:            .*\n)+?            mark_tab_rendered\("backtest"\)\n\s*',
              '\n    with tab7:\n',
              text,
              count=1,
          )
          text = re.sub(
              r'\n    with tab8:\n        # PERF: Lazy load Portfolio - only compute when tab opened\n        if not is_tab_rendered\("portfolio"\):\n(?:            .*\n)+?            mark_tab_rendered\("portfolio"\)\n\s*',
              '\n    with tab8:\n',
              text,
              count=1,
          )

          text = text.replace(
              '        ml_result = None',
              '        with st.spinner("Loading ML prediction…"):\n            from src.ml_service import run_ml_prediction\n            ml_result = run_ml_prediction(symbol, df)',
          )
          text = text.replace(
              '    if ml_result is None:\n        st.warning("ML: No predictions available")\n    else:',
              '    if not ml_result or ml_result.get("available") is False:\n        render_empty_state("ML model unavailable. Prediction engine requires sufficient historical data or model dependencies.", icon="")\n        reason = (ml_result or {}).get("reason")\n        if reason:\n            st.caption(reason)\n    else:',
          )

          text = text.replace(
              '    if ob.get("source") in {"unavailable", "synthetic"}:\n        render_notice_badge(\n            "Live order book unavailable. Showing fallback synthetic order book data.",\n            kind="warning",\n        )\n\n    src = ob.get("source", "")\n    if src == "synthetic":\n        st.caption("⚠️ Showing synthetic order book (Binance rate-limited)")\n\n    st.markdown(render_section_header(f"Live Order Book — {symbol}", f"Source: {src or \'Live\'}"), unsafe_allow_html=True)',
              '    src = ob.get("source", "Live")\n    source_status = ob.get("source_status", src.title() if src else "Live")\n    status_message = ob.get("status_message", "")\n    if source_status == "Live":\n        render_notice_badge(status_message or "Live order book connected.", kind="info")\n    elif source_status == "Cached":\n        render_notice_badge(status_message or "Using cached live order book data while reconnecting.", kind="warning")\n    elif source_status == "Synthetic":\n        render_notice_badge(status_message or "Live order book is temporarily unavailable. Showing synthetic fallback data.", kind="warning")\n\n    provider = ob.get("provider", "Binance")\n    shown_symbol = ob.get("symbol", symbol)\n    st.markdown(render_section_header(f"Order Book — {shown_symbol}", f"Source: {source_status} · Provider: {provider}"), unsafe_allow_html=True)',
          )
          text = text.replace('"source": "synthetic",', '"source": "Synthetic",')

          forbidden = [
              'ML: No predictions available',
              'Running Backtest...',
              'Loading Portfolio...',
              'Analyzing...',
              'Binance rate-limited',
              'Live order book unavailable. Showing fallback synthetic order book data.',
          ]
          remaining = [s for s in forbidden if s in text]
          if remaining:
              raise SystemExit(f'Forbidden strings remain in app.py: {remaining}')

          path.write_text(text, encoding='utf-8')
      - name: Verify
        run: |
          python -m py_compile app.py
          python -m compileall src
          ! grep -R "Live order book unavailable\|Binance rate-limited\|ML: No predictions available\|Running Backtest\.\.\.\|Loading Portfolio\.\.\.\|Analyzing\.\.\." app.py src
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-feature-ui-fixes.yml
          git add app.py src/data/orderbook.py src/ml_service.py src/orderbook_service.py src/ui/layout.py src/ui_states.py
          git commit -m "fix: remove persistent UI placeholders and stale fallback messages"
          git push origin HEAD:feature/performance-optimization-v2
