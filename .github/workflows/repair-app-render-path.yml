name: Repair app render path

on:
  push:
    branches:
      - feature/performance-optimization-v2

permissions:
  contents: write

jobs:
  repair-app-render-path:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/performance-optimization-v2
      - name: Repair app.py render path
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          def remove_block(lines, marker, stop_prefix):
              out = []
              i = 0
              while i < len(lines):
                  if marker in lines[i]:
                      i += 1
                      while i < len(lines) and not lines[i].lstrip().startswith(stop_prefix):
                          i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              return out

          lines = text.splitlines(keepends=True)
          lines = remove_block(lines, '# PERF: Lazy load AI Signals - only compute when tab opened', 'with st.spinner("Loading sentiment')
          lines = remove_block(lines, '# PERF: Lazy load Backtest - expensive computation only when tab opened', 'render_backtest(')
          lines = remove_block(lines, '# PERF: Lazy load Portfolio - only compute when tab opened', 'if "signal_result" in st.session_state')
          text = ''.join(lines)

          text = text.replace(
              '        ml_result = None',
              '        with st.spinner("Loading ML prediction…"):\n            from src.ml_service import run_ml_prediction\n            ml_result = run_ml_prediction(symbol, df)',
          )
          text = text.replace(
              '    if ml_result is None:\n        st.warning("ML: No predictions available")\n    else:',
              '    if not ml_result or ml_result.get("available") is False:\n        render_empty_state("ML model unavailable. Prediction engine requires sufficient historical data or model dependencies.", icon="")\n        reason = (ml_result or {}).get("reason")\n        if reason:\n            st.caption(reason)\n    else:',
          )

          lines = text.splitlines(keepends=True)
          out = []
          i = 0
          inserted = False
          while i < len(lines):
              if 'if ob.get("source") in {"unavailable", "synthetic"}:' in lines[i]:
                  while i < len(lines) and 'st.markdown(render_section_header' not in lines[i]:
                      i += 1
                  if i < len(lines):
                      i += 1
                  out.extend([
                      '    src = ob.get("source", "Live")\n',
                      '    source_status = ob.get("source_status", src.title() if src else "Live")\n',
                      '    status_message = ob.get("status_message", "")\n',
                      '    if source_status == "Live":\n',
                      '        render_notice_badge(status_message or "Live order book connected.", kind="info")\n',
                      '    elif source_status == "Cached":\n',
                      '        render_notice_badge(status_message or "Using cached live order book data while reconnecting.", kind="warning")\n',
                      '    elif source_status == "Synthetic":\n',
                      '        render_notice_badge(status_message or "Live order book is temporarily unavailable. Showing synthetic fallback data.", kind="warning")\n',
                      '\n',
                      '    provider = ob.get("provider", "Binance")\n',
                      '    shown_symbol = ob.get("symbol", symbol)\n',
                      '    st.markdown(render_section_header(f"Order Book — {shown_symbol}", f"Source: {source_status} · Provider: {provider}"), unsafe_allow_html=True)\n',
                  ])
                  inserted = True
                  continue
              out.append(lines[i])
              i += 1
          text = ''.join(out)
          text = text.replace('"source": "synthetic",', '"source": "Synthetic",')

          forbidden = [
              'Live order book unavailable',
              'Binance rate-limited',
              'ML: No predictions available',
              'Running Backtest...',
              'Loading Portfolio...',
              'Analyzing...',
          ]
          remaining = [s for s in forbidden if s in text]
          if remaining:
              raise SystemExit(f'Forbidden strings remain in app.py: {remaining}')
          if 'with tab6:\n    with st.spinner' in text:
              raise SystemExit('tab6 indentation was collapsed')
          if not inserted:
              raise SystemExit('order book status block was not replaced')

          path.write_text(text, encoding='utf-8')
      - name: Verify Python and stale strings
        run: |
          python -m py_compile app.py
          python -m compileall src
          ! grep -R "Live order book unavailable\|Binance rate-limited\|ML: No predictions available\|Running Backtest\.\.\.\|Loading Portfolio\.\.\.\|Analyzing\.\.\." app.py src
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-app-render-path.yml
          git add app.py src
          git commit -m "fix: repair app render path indentation"
          git push origin HEAD:feature/performance-optimization-v2
